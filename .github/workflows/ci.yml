name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Generate version metadata
        run: make generate-version-source

      - name: Validate Makefile
        run: make check-makefile

      - name: Build
        run: swift build

      - name: Test successful process output
        timeout-minutes: 2
        run: swift test --filter systemCommandRunnerPreservesSuccessfulTimedCommandOutput

      - name: Test large process output
        timeout-minutes: 2
        run: swift test --filter systemCommandRunnerDrainsOutputLargerThanPipeBuffer

      - name: Test process timeout
        timeout-minutes: 2
        run: swift test --filter systemCommandRunnerReturnsTimeoutWithoutWaitingForProcessExit

      - name: Test descendant process-group timeout
        timeout-minutes: 2
        run: swift test --filter systemCommandRunnerTimeoutTerminatesDescendantProcessGroup

      - name: Test detached process output
        timeout-minutes: 2
        run: swift test --filter systemCommandRunnerDoesNotWaitForAnEscapedDescendantHoldingOutputPipes

      - name: Test remaining suite
        timeout-minutes: 5
        run: swift test --skip systemCommandRunner

      - name: Guard against machine-specific defaults
        run: make check-no-machine-defaults

      - name: Validate docs
        run: make check-docs

      - name: Smoke version command
        run: make smoke-version

      - name: Smoke CLI behavior
        run: make smoke-cli

      - name: Smoke release artifact
        run: make check-release-artifact
